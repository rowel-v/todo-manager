<mat-sidenav-container class="h-screen">
  <!-- Sidebar -->
  <mat-sidenav #sidenav mode="side" opened class="w-52!">
    <div class="flex flex-row mx-5 mt-4 mb-2">
      <h1 class="text-xl font-bold">My Tasks</h1>
    </div>

    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/overview"
        class="rounded-lg!"
        (click)="currentSideNav.set('home')"
      >
        <mat-icon matListItemIcon>home</mat-icon>
        <span matListItemTitle>Home</span>
      </a>

      <a
        mat-list-item
        routerLink="/tasks"
        class="rounded-lg!"
        (click)="currentSideNav.set('tasks')"
      >
        <mat-icon matListItemIcon>check_circle</mat-icon>
        <span matListItemTitle>Tasks</span>
      </a>

      <a
        mat-list-item
        routerLink="/settings"
        class="rounded-lg!"
        (click)="currentSideNav.set('settings')"
      >
        <mat-icon matListItemIcon>settings</mat-icon>
        <span matListItemTitle>Settings</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <!-- Main content container-->
  <mat-sidenav-content class="flex! flex-col! h-full! overflow-hidden!">
    <!-- Header container-->
    <div
      class="flex flex-row mx-6 my-3 w-full shrink-0 overflow-hidden items-center gap-6 justify-between"
    >
      <!--Sub-header container-->
      <div class="flex flex-col">
        <!--Sidebar button toggle-->
        <div class="flex flex-row gap-4 items-center">
          <button
            mat-icon-
            (click)="sidenav.toggle(); openSideNav.set(!openSideNav())"
            class="flex! cursor-pointer"
          >
            <mat-icon class="rotate-in-center">{{ openSideNav() ? 'menu' : 'close' }} /></mat-icon>
          </button>
          <!--Header label-->
          <h1 class="text-2xl text-gray-100 font-bold">{{ title() }}</h1>
        </div>
        <!--Header description-->
        <p  >{{ description() }}</p>
      </div>

      <!--user profile-->
      <div class="avatar mr-10">
        <div class="w-12 rounded-full">
          <img
            alt="Tailwind-CSS-Avatar-component"
            src="https://img.daisyui.com/images/profile/demo/yellingcat@192.webp"
          />
        </div>
      </div>  
    </div>

    <!--Content-->
    <div class="min-h-0 flex-1 overflow-y-auto mx-2">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
