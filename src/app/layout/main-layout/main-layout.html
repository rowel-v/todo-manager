<div class="flex h-screen bg-[#12464a] text-gray-200">
  <!-- Sidebar -->
  <aside
    class="flex flex-col h-screen transition-all duration-300 overflow-hidden border-r border-[#166169]"
    [class.w-54]="openSideNav()"
    [class.w-16]="!openSideNav()"
  >
    <!-- Sidebar Header -->
    <div class="shrink-0">
      @if (openSideNav()) {
        <div class="flex items-center justify-between ps-6 pe-3 py-3">
          <h1 class="text-[21px] font-roboto font-medium whitespace-nowrap">My Tasks</h1>
          <button class="btn btn-square btn-ghost" (click)="openSideNav.set(false)">
            <svg lucideX></svg>
          </button>
        </div>
      } @else {
        <div class="flex justify-center py-3">
          <button class="btn btn-square btn-ghost" (click)="openSideNav.set(true)">
            <svg lucideMenu></svg>
          </button>
        </div>
      }
    </div>

    <!-- Navigation -->
    <div class="flex flex-col text-[18px]">
      <!-- Home -->
      <div
        class="flex items-center py-3"
        [class]="openSideNav() ? 'hover:bg-gray-500' : ''"
        [class.gap-4]="openSideNav()"
        [class.px-6]="openSideNav()"
        [class.py-3]="openSideNav()"
        [class.py-1]="!openSideNav()"
        [class.justify-center]="!openSideNav()"
        routerLink="/overview"
        (click)="currentSideNav.set('home')"
      >
        @if (openSideNav()) {
          <div class="flex items-center gap-4 cursor-pointer">
            <svg lucideHome class="shrink-0"></svg>
            <p class="whitespace-nowrap">Home</p>
          </div>
        } @else {
          <button class="btn btn-square btn-ghost">
            <svg lucideHome class="shrink-0"></svg>
          </button>
        }
      </div>

      <!-- Tasks -->
      <div
        class="flex items-center"
        [class]="openSideNav() ? 'hover:bg-gray-500' : ''"
        [class.gap-4]="openSideNav()"
        [class.px-6]="openSideNav()"
        [class.py-3]="openSideNav()"
        [class.py-1]="!openSideNav()"
        [class.justify-center]="!openSideNav()"
        routerLink="/tasks"
        (click)="currentSideNav.set('tasks')"
      >
        @if (openSideNav()) {
          <svg lucideBadgeCheck class="shrink-0"></svg>
          <p class="whitespace-nowrap">Tasks</p>
        } @else {
          <button class="btn btn-square btn-ghost">
            <svg lucideBadgeCheck class="shrink-0"></svg>
          </button>
        }
      </div>

      <!-- Settings -->
      <div
        class="flex items-center"
        [class]="openSideNav() ? 'hover:bg-gray-500' : ''"
        [class.gap-4]="openSideNav()"
        [class.px-6]="openSideNav()"
        [class.py-3]="openSideNav()"
        [class.py-1]="!openSideNav()"
        [class.justify-center]="!openSideNav()"
        routerLink="/settings"
        (click)="currentSideNav.set('settings')"
      >
        @if (openSideNav()) {
          <svg lucideSettings class="shrink-0"></svg>
          <p class="whitespace-nowrap">Settings</p>
        } @else {
          <button class="btn btn-square btn-ghost">
            <svg lucideSettings class="shrink-0"></svg>
          </button>
        }
      </div>
    </div>
  </aside>

  <!-- Header + Content -->
  <main class="flex flex-col flex-1 min-w-0">
    <!-- Header -->
    <header class="flex items-center justify-between mx-6 my-3 shrink-0 max-h-14">
      <div class="flex flex-col">
        <h1 class="text-2xl font-bold">
          {{ currentSideNav() == 'home' ? title() + ' Rowel!' : title() }}
        </h1>
        <p class="pt-1">{{ description() }}</p>
      </div>

      <!-- User profile -->
      <button class="btn btn-circle btn-ghost w-12 h-12 p-0">
        <img
          alt="Profile"
          src="https://img.daisyui.com/images/profile/demo/yellingcat@192.webp"
          class="w-full h-full rounded-full"
        />
      </button>
    </header>

    <!-- Content -->
    <div class="min-h-0 flex-1 overflow-y-auto mx-2">
      <router-outlet />
    </div>
  </main>
</div>
