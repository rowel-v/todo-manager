<mat-sidenav-container class="h-screen">
  <!-- Sidebar -->
  <mat-sidenav #sidenav mode="side" opened class="w-52!">
    <div class="flex flex-row p-6 justify-between">
      <h1 class="text-xl font-bold">Todo App</h1>

      <button mat-icon-button (click)="sidenav.toggle()" class="cursor-pointer">
        <mat-icon>menu</mat-icon>
      </button>
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/home">
        <mat-icon matListItemIcon>home</mat-icon>
        <span matListItemTitle>Home</span>
      </a>

      <a mat-list-item routerLink="/tasks">
        <mat-icon matListItemIcon>check_circle</mat-icon>
        <span matListItemTitle>Todos</span>
      </a>

      <a mat-list-item routerLink="/dashboard">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>

      <a mat-list-item routerLink="/settings">
        <mat-icon matListItemIcon>settings</mat-icon>
        <span matListItemTitle>Settings</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <!-- Main content -->
  <mat-sidenav-content>
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
