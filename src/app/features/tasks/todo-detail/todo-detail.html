<!-- Dialog Header -->
<h2 mat-dialog-title class="text-2xl font-bold text-gray-800 border-b pb-4 m-0">Todo Details</h2>

<!-- Dialog Content -->
<mat-dialog-content class="mat-typography pt-6!">
  <div class="flex flex-col space-y-5">
    <!-- Title -->
    <div>
      <span class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">
        Title
      </span>
      <span class="block text-lg text-gray-900 font-medium">
        {{ todo.name }}
      </span>
    </div>

    <!-- Description -->
    <div>
      <span class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">
        Description
      </span>
      <p
        class="text-gray-700 whitespace-pre-wrap bg-gray-50 p-3 rounded-md border border-gray-100 min-h-20"
      >
        {{ todo.description || 'No description provided.' }}
      </p>
    </div>

    <!-- Status and Due Date Grid -->
    <div class="grid grid-cols-2 gap-4">
      <!-- Status -->
      <div>
        <span class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">
          Status
        </span>
        <span
          class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium"
          [ngClass]="{
            'bg-green-100 text-green-800': todo.status === 'completed',
            'bg-yellow-100 text-yellow-800': todo.status === 'pending' || !todo.status,
            'bg-blue-100 text-blue-800': todo.status === 'in_progress',
          }"
        >
          {{ todo.status || 'Pending' }}
        </span>
      </div>

      <!-- Due Date -->
      <div>
        <span class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">
          Due Date
        </span>
        <span class="block text-gray-900 font-medium">
          {{ formattedDueDate() }}
        </span>
      </div>
    </div>
  </div>
</mat-dialog-content>

<!-- Dialog Actions -->
<mat-dialog-actions align="end" class="border-t pb-4! pt-4! pr-6!">
  <button
    mat-button
    mat-dialog-close
    (click)="closed.emit()"
    class="text-gray-600 hover:bg-gray-100 mr-2"
  >
    Close
  </button>
  <button
    mat-flat-button
    color="primary"
    (click)="markAsCompleted.emit(todo)"
    [disabled]="todo.status === 'completed'"
  >
    Mark as Completed
  </button>
</mat-dialog-actions>
