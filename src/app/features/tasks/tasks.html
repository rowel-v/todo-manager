<div class="mx-auto max-w-5xl p-6">
  <!-- Header -->
  <div class="mb-6 flex flex-row items-center justify-between">
    <div>
      <h1 class="text-3xl font-bold">Tasks</h1>
      <p class="mt-1 text-gray-500">Manage your todos and stay organized.</p>
    </div>

    <button (click)="openCreateTodoFormDialog()" mat-raised-button color="primary">
      <mat-icon>add</mat-icon>
      Add Todo
    </button>
  </div>

  <!-- Filters -->
  <mat-card class="mb-6">
    <mat-card-content>
      <mat-button-toggle-group value="all">
        <mat-button-toggle value="all"> All </mat-button-toggle>

        <mat-button-toggle value="pending"> Pending </mat-button-toggle>

        <mat-button-toggle value="in_progress"> In Progress </mat-button-toggle>

        <mat-button-toggle value="completed"> Completed </mat-button-toggle>
      </mat-button-toggle-group>
    </mat-card-content>
  </mat-card>

  <!-- Tasks -->
  <div class="flex flex-col gap-3">
    <mat-card>
      <mat-card-content>
        @for (todo of todos(); track todo.id) {
          <!-- 1. Moved matRipple and (click) here. Added relative, overflow-hidden, cursor-pointer, and padding -->
          <div
            class="flex items-center gap-4 p-3 rounded-lg relative overflow-hidden cursor-pointer hover:bg-gray-50 transition-colors"
            matRipple
            (click)="selectedTodo = todo; openTodoDetail()"
          >
            <!-- Removed mb-7 to balance the padding we added to the parent -->
            <div class="flex-1 py-2">
              <h3 class="text-lg font-semibold">{{ todo.name }}</h3>
              <p class="mt-1 text-sm text-gray-500">{{ todo.description }}</p>

              <div class="mt-3 flex items-center gap-3">
                <mat-chip>{{ todo.priority }}</mat-chip>
                <span class="text-sm text-gray-500"> Due: {{ formatDateTime(todo.duedate) }} </span>
              </div>
            </div>

            <!-- 3. Added $event.stopPropagation() so clicking the menu doesn't open the dialog -->
            <button
              mat-icon-button
              [matMenuTriggerFor]="menu"
              (click)="$event.stopPropagation(); selectedTodo = todo"
            >
              <mat-icon>more_vert</mat-icon>
            </button>
          </div>
        } @empty {
          <app-empty-todos (createTodo)="openCreateTodoFormDialog()"></app-empty-todos>
        }
      </mat-card-content>
    </mat-card>
  </div>
</div>

<!-- Menu -->
<mat-menu #menu="matMenu">
  <button mat-menu-item (click)="selectedTodo && openEditTodoFormDialog()">
    <mat-icon>edit</mat-icon>
    <span>Edit</span>
  </button>

  <button mat-menu-item (click)="selectedTodo && openDeleteTodoDialog(selectedTodo)">
    <mat-icon>delete</mat-icon>
    <span>Delete</span>
  </button>
</mat-menu>
