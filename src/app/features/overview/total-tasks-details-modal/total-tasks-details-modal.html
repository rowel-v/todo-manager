<!--Invisible backdrop, Covers the entire viewport and catches clicks outside the modal.Since it has no background color, it remains visually invisible.-->
<div class="fixed inset-0 z-9998 cursor-default" (click)="closeModal()"></div>

<!--Modal container, Positioned beside the Total Tasks stat.-->
<div
  class="absolute left-full top-0 z-9999 ml-2 cursor-default"
  [class.scale-in-tl]="!isClosing()"
  [class.scale-out-tl]="isClosing()"
>
  <!--Modal content, Contains the actual Total Tasks information.-->
  <div class="w-80 rounded-xl border border-base-300 bg-base-100 p-5 shadow-xl">
    <!-- Header -->
    <div class="mb-4 flex justify-between">
      <!-- Modal title -->
      <div>
        <h2 class="text-lg font-bold">Total Tasks</h2>
      </div>

      <!--Close button-->
      <mat-icon class="cursor-pointer hover:bg-gray-200" (click)="closeModal()"> close </mat-icon>
    </div>

    <!--Task breakdown, Displays the number of tasks for each status/category.-->
    <div class="space-y-3">
      <!-- Completed tasks -->
      <div class="flex items-center justify-between p-2 hover:bg-blue-100 cursor-pointer rounded-lg transition-colors duration-200">
        <div class="flex items-center gap-2">
          <mat-icon class="text-success">check_circle</mat-icon>
          <span>Completed</span>
        </div>

        <span class="font-semibold">
          {{ completedTodos().length }}
        </span>
      </div>

      <!-- Pending tasks -->
      <div class="flex items-center justify-between p-2 hover:bg-blue-100 cursor-pointer rounded-lg transition-colors duration-200">
        <div class="flex items-center gap-2">
          <mat-icon class="text-warning">pending</mat-icon>
          <span>Pending</span>
        </div>

        <span class="font-semibold">
          {{ pendingTodos().length }}
        </span>
      </div>

      <!-- Overdue tasks -->
      <div class="flex items-center justify-between p-2 hover:bg-blue-100 cursor-pointer rounded-lg transition-colors duration-200">
        <div class="flex items-center gap-2">
          <mat-icon class="text-error">warning</mat-icon>
          <span>Overdue</span>
        </div>

        <span class="font-semibold">
          {{ overdueTodos().length }}
        </span>
      </div>

      <!-- Upcoming tasks -->
      <div class="flex items-center justify-between p-2 hover:bg-blue-100 cursor-pointer rounded-lg transition-colors duration-200">
        <div class="flex items-center gap-2">
          <mat-icon class="text-info">event</mat-icon>
          <span>Upcoming</span>
        </div>

        <span class="font-semibold">
          {{ upcomingTodos().length }}
        </span>
      </div>
    </div>
  </div>
</div>
