@switch (status()) {
  @case ('Pending') {
    <div
      class="inline-flex items-center gap-2 rounded-sm px-2 bg-[#f4ff9d] text-app-text-green text-[13px] font-medium"
    >
      <svg lucideClock5 [size]="17" />
      <p>{{ status() }}</p>
    </div>
  }
  @case ('In Progress') {
    <div
      class="inline-flex items-center gap-2 rounded-sm px-2 bg-[#c5c8fc] text-app-text-green text-[13px] font-medium"
    >
      <svg lucideCircleEllipsis [size]="17" />

      <p>{{ status() }}</p>
    </div>
  }
  @case ('Completed') {
    <div
      class="inline-flex items-center gap-2 rounded-sm px-2 bg-[#68f8b5] text-app-text-green text-[13px] font-medium"
    >
      <svg lucideCircleCheck [size]="17" />
      <p>{{ status() }}</p>
    </div>
  }
}
